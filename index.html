<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="WorkoutLog support, privacy and terms." />
    <title>WorkoutLog</title>
    <style>
      :root { color-scheme:light; --ink:#171717; --sub:#5d6268; --line:#e7e8ea; --accent:#2957d3; }
      * { box-sizing:border-box; }
      body { margin:0; background:#f7f8fa; color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { width:min(680px,calc(100% - 32px)); margin:48px auto; padding:48px; background:white; border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 50px rgba(20,28,45,.08); }
      h1 { margin:0; font-size:clamp(2rem,7vw,3rem); line-height:1.08; letter-spacing:-.04em; }
      p { color:var(--sub); }
      nav { display:grid; gap:12px; margin-top:28px; }
      a { display:block; padding:14px 16px; border:1px solid var(--line); border-radius:14px; color:var(--accent); text-decoration:none; font-weight:700; }
      a:hover { border-color:var(--accent); }
      @media (max-width:600px) { main { margin:0; width:100%; min-height:100vh; padding:32px 22px; border:0; border-radius:0; box-shadow:none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>WorkoutLog</h1>
      <p>Support and legal information for the WorkoutLog fitness tracker.</p>
      <nav aria-label="WorkoutLog pages">
        <a href="./support/">Support</a>
        <a href="./privacy/">Privacy Policy</a>
        <a href="./terms/">Terms of Use</a>
      </nav>
    </main>
  </body>
</html>
